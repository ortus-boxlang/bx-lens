<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>BX Lens Console</title>
<link rel="stylesheet" href="{{base}}/assets/console.css">
</head>
<body>
<div class="centerwrap">
  <div class="card login" style="width:min(560px,100%)">
    <div class="logo" aria-hidden="true"></div>
    <h1>Set a password first</h1>
    <p>The console is on, but no password is configured, so nobody can sign in. Add one to the module settings in <span class="mono">boxlang.json</span>, using an encrypted <span class="mono">bxsecret:</span> value, then reload.</p>
    <pre class="code">"modules": { "bxlens": { "settings": {
  "console": { "enabled": true, "password": "bxsecret:..." }
} } }</pre>
  </div>
</div>
</body>
</html>
